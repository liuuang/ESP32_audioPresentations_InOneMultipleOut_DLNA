[platformio]
default_envs = master

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:master]
board = freenove_esp32_s3_wroom   ; N16R8: 16MB Flash + 8MB OPI PSRAM（兼容 ESP32-S3-WROOM-1）
build_src_filter = +<main.cpp>
lib_deps = ESP32-audioI2S
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
# PSRAM 由板定义启用：memory_type=qio_opi + BOARD_HAS_PSRAM（8MB Octal）

[env:slave_s3]
board = freenove_esp32_s3_wroom   ; N16R8: 16MB Flash + 8MB OPI PSRAM
build_src_filter = +<slave_s3.cpp>
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB

; USB Host 音箱实验：OTG 口插 USB 音箱/声卡，验证 host 驱动出声
[env:test_usb_speaker]
board = freenove_esp32_s3_wroom
build_src_filter = +<test_usb_speaker.cpp>
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
