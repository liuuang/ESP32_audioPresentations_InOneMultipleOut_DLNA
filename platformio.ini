; DLNA 多路 ESP32 音频项目
; 底部状态栏点环境名切换 master / slave

[platformio]
default_envs = master

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

[env:master]
build_src_filter = +<main.cpp>
lib_deps = ESP32-audioI2S
;库依赖是 ESP32-audioI2S，注意大小写，ESP32-audioI2S 不是 ESP32-audioi2s
;可以写网址，可以写arduino的作者/项目，可以写github的作者/项目，也可以写github的作者/项目#分支名，还可以lib直接下载然后写名字
[env:slave]
build_src_filter = +<slave.cpp>